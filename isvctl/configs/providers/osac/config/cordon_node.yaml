# OSAC focused CordonNodeCheck configuration (BFX01-04).
# Select the validation with: -- -v -s -k CordonNodeCheck
#
# Environment variables:
#   KUBECONFIG: Credentials/context for the intended test cluster.
#   KUBECTL: Set to oc for OpenShift.
#   ISVTEST_BREAKFIX_NODE: Dedicated Ready, schedulable test node.
#     The cordon helper skips when this value is unset or empty.
#   ISVTEST_BREAKFIX_NAMESPACE: Optional probe namespace.
#     Defaults to osac-e2e-ci when unset or empty.

import: ../../../suites/k8s.yaml

version: "1.0"

commands:
  kubernetes:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: setup
        phase: setup
        command: "python3 ../../ocp/scripts/k8s/setup.py"
        output_schema: cluster
        timeout: 300

      - name: cordon_node
        phase: test
        skip: false
        command: "python3 ../../../shared/breakfix/cordon_node.py"
        args:
          - "--node={{breakfix_node}}"
          - "--namespace={{breakfix_namespace}}"
        timeout: 1200

      - name: teardown
        phase: teardown
        command: "python3 ../../ocp/scripts/k8s/teardown.py"
        timeout: 30

tests:
  description: "OSAC focused CordonNodeCheck validation (BFX01-04)"
  settings:
    breakfix_node: "{{env.ISVTEST_BREAKFIX_NODE | default('', true)}}"
    breakfix_namespace: "{{env.ISVTEST_BREAKFIX_NAMESPACE | default('osac-e2e-ci', true)}}"
